    <meta property="og:description" content="Veja todos os produtos analisados desta categoria no Arthur Recomenda.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:url" content="https://arthurrecomenda.com/categoria.html">
    <meta property="og:image" content="https://arthurrecomenda.com/assets/img/banner-og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <meta name="theme-color" content="#000000">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <noscript>
        <style>.animate-on-scroll { opacity: 1 !important; animation: none !important; }</style>
    </noscript>

    <header class="header">
        <div class="container header__container">
                        <a href="/" class="header__logo">ARTHUR <span>RECOMENDA</span></a>
                        <!-- BOTÃO DE TROCAR TEMA -->
            <button class="theme-toggle" id="themeToggle" aria-label="Trocar tema">
                <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </header>

    <main class="main-content categoria-page">
        <section class="categoria-header animate-on-scroll">
            <div class="container">
                
                <!-- NOVO LAYOUT: TOPO DA CATEGORIA (Busca + Sidebar com Banner e Destaque) -->
                <div class="cat-header-layout">
                    <!-- LADO ESQUERDO (Título e Busca) -->
                    <div class="cat-main-side">
                        <a href="index.html" class="back-link">← Voltar para o Catálogo</a>
                        <h1 id="cat-title">Categoria</h1>
                        <div class="search-box">
                            <svg class="search-box__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" id="cat-search-input" class="search-box__input" placeholder="Buscar dentro desta categoria..." autocomplete="off">
                        </div>
                    </div>

                    <!-- LADO DIREITO (Apenas Produto Destaque) -->
                    <div class="cat-sidebar">
                        <div class="cat-featured-box" id="cat-featured-product">
                            <!-- O JavaScript vai injetar o produto destaque aqui -->
                        </div>
                    </div>
                </div>

            </div>
        </section>
        
        <section class="categoria-grid-section">
            <div class="container">
                <div id="prod-grid" class="prod-grid"></div>
                <!-- CONTAINER DA PAGINAÇÃO ADICIONADO AQUI -->
                <div id="pagination-container" class="pagination-container"></div>
            </div>
        </section>
    </main>

    
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/categoria.js"></script>

    <!-- BOTÃO VOLTAR AO TOPO -->
    <button id="backToTop" class="back-to-top-btn" aria-label="Voltar ao topo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    </button>

</body>
</html>
